name: Build GameStream
on: [push, workflow_dispatch]
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GameStream-phone-apk
          path: app/build/outputs/apk/debug/*.apk
  translator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: gradle assembleDebug
        working-directory: translator
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-apk
          path: translator/app/build/outputs/apk/debug/*.apk
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      # Папка вместо одного exe: такие сборки антивирусы не путают с вирусами
      - run: pyinstaller --onedir --windowed --noupx --name GameStreamPC pc/gamestream_pc.py
      - uses: actions/upload-artifact@v4
        with:
          name: GameStream-PC
          path: dist/GameStreamPC/

  # Публикует готовые файлы: постоянные ссылки на последнюю версию, без входа в аккаунт
  release:
    needs: [android, translator, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp out/GameStream-phone-apk/*.apk GameStream.apk
          cp out/ScreenTranslator-apk/*.apk ScreenTranslator.apk
          (cd out/GameStream-PC && zip -qr ../../GameStreamPC.zip .)
          gh release create "v1.${{ github.run_number }}" GameStream.apk ScreenTranslator.apk GameStreamPC.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Версия 1.${{ github.run_number }}" --notes "Автоматическая сборка"
